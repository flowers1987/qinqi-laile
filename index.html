<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1311" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="亲戚来了" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-512.png" />
  <title>亲戚来了 · 经期记录</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="phone">
    <main class="app">

      <!-- ===================== 看板 / 日历首页 ===================== -->
      <section id="view-dashboard" class="view active">
        <header class="view-header">
          <div class="greet" id="greet-text">你好</div>
          <div class="sub" id="today-label">今天</div>
        </header>

        <div class="content" id="dash-scroll">
          <!-- 下拉刷新指示器 -->
          <div class="ptr" id="ptr"><div class="ptr-ring"></div><span id="ptr-text">下拉刷新</span></div>

          <!-- 日历卡 -->
          <div class="card calendar-card">
            <div class="cal-head">
              <button class="cal-nav" id="cal-prev" aria-label="上个月">
                <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="cal-title" id="cal-title">2026年8月</div>
              <button class="cal-nav" id="cal-next" aria-label="下个月">
                <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            <div class="cal-week" id="cal-week"></div>
            <div class="cal-grid" id="cal-grid"></div>
            <div class="cal-legend">
              <span class="lg"><i class="dot dot-record"></i>已记录</span>
              <span class="lg"><i class="dot dot-predict"></i>预测</span>
              <span class="lg"><i class="dot dot-today"></i>今天</span>
            </div>
          </div>

          <button class="cta" id="go-record">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            记录一次经期
          </button>
          <div class="hint">点按任意日期可快速记录 · 下滑可刷新预测</div>
        </div>
      </section>

      <!-- ===================== 记录页 ===================== -->
      <section id="view-record" class="view">
        <header class="view-header">
          <div class="greet">经期记录</div>
          <div class="sub">记录每月经期，自动预测周期</div>
        </header>

        <div class="content">
          <div class="rec-toolbar">
            <div class="list-head"><span>历史记录</span><span class="muted" id="record-count">0 条</span></div>
            <button class="chip-add" id="add-record">
              <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
              新增
            </button>
          </div>
          <div class="record-list" id="record-list"></div>
        </div>
      </section>

      <!-- ===================== 设置页 ===================== -->
      <section id="view-settings" class="view">
        <header class="view-header">
          <div class="greet">设置</div>
          <div class="sub">个性化你的周期与看板</div>
        </header>

        <div class="content">
          <div class="group-title">周期设置</div>
          <div class="card">
            <label class="row">
              <span>常规周期（天）</span>
              <div class="stepper sm">
                <button type="button" id="cyc-minus">−</button>
                <input type="number" id="in-cycle" min="20" max="45" inputmode="numeric" />
                <button type="button" id="cyc-plus">＋</button>
              </div>
            </label>
            <div class="divider"></div>
            <label class="row">
              <span>经期时长（天）</span>
              <div class="stepper sm">
                <button type="button" id="pl-minus">−</button>
                <input type="number" id="in-period-len" min="2" max="12" inputmode="numeric" />
                <button type="button" id="pl-plus">＋</button>
              </div>
            </label>
          </div>

          <div class="group-title">看板外观</div>
          <div class="card">
            <div class="row col">
              <span class="row-label">主题色</span>
              <div class="swatches" id="swatches"></div>
            </div>
            <div class="divider"></div>
            <label class="row">
              <span>每周起始</span>
              <div class="seg" id="week-seg">
                <button data-val="1" class="active">周一</button>
                <button data-val="0">周日</button>
              </div>
            </label>
          </div>

          <div class="group-title">数据</div>
          <div class="card">
            <button class="row link" id="btn-export">
              <span>导出 Excel 数据</span>
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="divider"></div>
            <button class="row link danger" id="btn-clear">
              <span>清空所有数据</span>
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m2 0v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>

          <div class="about">亲戚来了 · v1.1<br/>无广告 · 纯工具 · 数据仅存于本机</div>
        </div>
      </section>

    </main>

    <nav class="tabbar">
      <button class="tab active" data-view="dashboard">
        <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="4.5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 3v3M16 3v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>看板</span>
      </button>
      <button class="tab" data-view="record">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 20h9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>记录</span>
      </button>
      <button class="tab" data-view="settings">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>设置</span>
      </button>
    </nav>
  </div>

  <!-- ===================== 记录底部弹层（原生风格 sheet） ===================== -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="记录经期">
    <div class="sheet-grip"></div>
    <div class="sheet-head"><div class="sheet-title" id="form-title">新增记录</div></div>
    <div class="sheet-body">
      <label class="field">
        <span>开始日期</span>
        <input type="date" id="in-start" />
      </label>
      <label class="field">
        <span>持续天数</span>
        <div class="stepper">
          <button type="button" id="dur-minus">−</button>
          <input type="number" id="in-duration" min="1" max="15" inputmode="numeric" />
          <button type="button" id="dur-plus">＋</button>
        </div>
      </label>
    </div>
    <div class="form-actions">
      <button class="btn-ghost" id="form-cancel">取消</button>
      <button class="btn-primary" id="form-submit">保存记录</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <!-- 启动闪屏：避免白屏，模拟原生启动 -->
  <div class="splash" id="splash" style="background:#1a1311">
    <div class="splash-logo">亲戚来了</div>
    <div class="splash-sub">经期记录 · 温柔守护</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
